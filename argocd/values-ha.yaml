# argocd/values-ha.yaml — argo/argo-cd chart 10.9.2 (Argo CD v3.5.3)
# Used twice: once by `helm install` on day 0, then by the argocd Application
# (apps/argocd.yaml), so Argo CD manages its own install from this same file.
#
# What HA means per component:
#   redis-ha        3 Redis + 3 Sentinel + 3 HAProxy. The one piece that really fails over.
#   repoServer      stateless, renders manifests. 2+ replicas; this is what runs out of memory.
#   server          stateless API/UI. 2+ replicas.
#   applicationSet  2 replicas with leader election: one works, one waits.
#   controller      NOT active-active. Replicas > 1 means sharding by cluster; with one
#                   destination cluster a second replica only waits. Kept at 1 on purpose.

redis-ha:
  enabled: true          # the chart's warning: needs 3 nodes (hard anti-affinity)

controller:
  replicas: 1            # no PDB: with one replica, minAvailable 1 would block every node drain

server:
  replicas: 2
  pdb:
    enabled: true
    minAvailable: 1

repoServer:
  replicas: 2
  pdb:
    enabled: true
    minAvailable: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi        # a mass sync renders many charts at once; this is the component that OOMs

applicationSet:
  replicas: 2
  pdb:
    enabled: true
    minAvailable: 1

dex:
  enabled: false         # not needed: Argo CD talks OIDC to ZITADEL directly (configs.cm.oidc.config)

notifications:
  enabled: false

configs:
  params:
    server.insecure: "true"   # the lab reaches the UI through port-forward; TLS belongs on the gateway
    # Concurrent manifest generations per repo-server replica. 0 (default) = unlimited,
    # so a mass sync renders everything at once and memory spikes past the limit.
    reposerver.parallelism.limit: 5
  cm:
    # product-*-gitops overlays wrap the chart with kustomize `helmCharts:`.
    # Without this flag the repo-server refuses to render them:
    #   "must specify --enable-helm"
    kustomize.buildOptions: --enable-helm
    # The URL users open. It is also the base of the OIDC redirect URI registered in ZITADEL
    # (http://localhost:8080/auth/callback); if the two differ, login ends in "invalid redirect_uri".
    url: http://localhost:8080
    # SSO through ZITADEL, no Dex. clientID and clientSecret are generated by ZITADEL when
    # scripts/zitadel-setup.sh creates the app, so they can't be in this file: "$secret:key" reads
    # them from the Secret argocd-oidc-zitadel. Argo CD only resolves that reference in Secrets
    # labeled app.kubernetes.io/part-of: argocd (the same label that took Argo CD down in the
    # previous post).
    oidc.config: |
      name: ZITADEL
      issuer: http://zitadel.127.0.0.1.nip.io:8081
      clientID: $argocd-oidc-zitadel:clientID
      clientSecret: $argocd-oidc-zitadel:clientSecret
      requestedScopes:
        - openid
        - profile
        - email
        - groups
      logoutURL: http://zitadel.127.0.0.1.nip.io:8081/oidc/v1/end_session
  rbac:
    # Nobody gets anything by default. Roles come from the "groups" claim, which ZITADEL's
    # groupsClaim Action fills from the project roles (ZITADEL itself puts roles in
    # urn:zitadel:iam:org:project:roles). The local admin stays as the break-glass account.
    policy.default: ""
    scopes: "[groups]"
    policy.csv: |
      g, platform-admins, role:admin
      g, platform-viewers, role:readonly
