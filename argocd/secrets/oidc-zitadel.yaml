# argocd/secrets/oidc-zitadel.yaml — the client ID and secret ZITADEL generated for Argo CD.
# In blog-05 scripts/zitadel-setup.sh wrote them straight into this Secret, the one secret that was
# never in Git. Now the script writes them to Vault and ESO builds the Secret.
# The label is not optional: Argo CD resolves $argocd-oidc-zitadel:clientSecret in oidc.config
# only from Secrets labeled app.kubernetes.io/part-of: argocd. ESO doesn't copy it on its own;
# template.metadata puts it on the Secret it writes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc-zitadel
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target:
    name: argocd-oidc-zitadel
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  dataFrom:
    - extract: {key: platform/argocd/oidc-zitadel}
