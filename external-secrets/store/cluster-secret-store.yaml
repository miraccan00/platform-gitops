# One store for the whole cluster. ESO logs in to Vault as its own ServiceAccount
# (Vault role "eso", read-only on secret/platform/*); no Vault token is stored anywhere.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: http://vault-active.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
            audiences: [vault]
