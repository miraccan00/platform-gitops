# Step 1 of the move: ESO writes shadow copies next to the Secrets still in Git.
# Nothing reads them yet; they exist to prove Vault holds the same values (compare SHA-256 prefixes).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-postgres-eso
  namespace: zitadel
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target: {name: zitadel-postgres-eso}
  data:
    - {secretKey: POSTGRES_USER,     remoteRef: {key: platform/zitadel/db, property: POSTGRES_USER}}
    - {secretKey: POSTGRES_PASSWORD, remoteRef: {key: platform/zitadel/db, property: POSTGRES_PASSWORD}}
    - {secretKey: POSTGRES_DB,       remoteRef: {key: platform/zitadel/db, property: POSTGRES_DB}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-db-eso
  namespace: zitadel
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target: {name: zitadel-db-eso}
  data:
    - {secretKey: ZITADEL_DATABASE_POSTGRES_DSN, remoteRef: {key: platform/zitadel/db, property: ZITADEL_DATABASE_POSTGRES_DSN}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-masterkey-eso
  namespace: zitadel
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target: {name: zitadel-masterkey-eso}
  data:
    - {secretKey: masterkey, remoteRef: {key: platform/zitadel/masterkey, property: masterkey}}
