# zitadel/db/externalsecrets.yaml — the three Secrets that used to be base64 in this directory.
# Same names, so ZITADEL and Postgres don't change; the values now come from Vault
# (secret/platform/zitadel/*), and this file holds only where to find them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-postgres
  namespace: zitadel
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target: {name: zitadel-postgres}
  data:
    - {secretKey: POSTGRES_USER,     remoteRef: {key: platform/zitadel/db, property: POSTGRES_USER}}
    - {secretKey: POSTGRES_PASSWORD, remoteRef: {key: platform/zitadel/db, property: POSTGRES_PASSWORD}}
    - {secretKey: POSTGRES_DB,       remoteRef: {key: platform/zitadel/db, property: POSTGRES_DB}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-db
  namespace: zitadel
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target: {name: zitadel-db}
  data:
    - {secretKey: ZITADEL_DATABASE_POSTGRES_DSN, remoteRef: {key: platform/zitadel/db, property: ZITADEL_DATABASE_POSTGRES_DSN}}
---
# Moves unchanged: ZITADEL encrypts its data with this key, a new one can't read the old data.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-masterkey
  namespace: zitadel
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target: {name: zitadel-masterkey}
  data:
    - {secretKey: masterkey, remoteRef: {key: platform/zitadel/masterkey, property: masterkey}}
