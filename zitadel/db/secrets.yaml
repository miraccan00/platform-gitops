# zitadel/db/secrets.yaml — ON PURPOSE, the state most teams start from: Secrets in Git, base64 only.
# base64 is encoding, not encryption: anyone who can read this repo can read these values.
# The next post (05b) moves them into Vault through External Secrets and rotates every value,
# because these are in the Git history forever. Lab values only; never reuse them.
apiVersion: v1
kind: Secret
metadata:
  name: zitadel-postgres
  namespace: zitadel
type: Opaque
data:
  POSTGRES_USER: eml0YWRlbA==
  POSTGRES_PASSWORD: bGFiMDUtcG9zdGdyZXMtcGFzc3dvcmQ=
  POSTGRES_DB: eml0YWRlbA==
---
# ZITADEL reads the database connection from this env var (chart: envVarsSecret).
apiVersion: v1
kind: Secret
metadata:
  name: zitadel-db
  namespace: zitadel
type: Opaque
data:
  ZITADEL_DATABASE_POSTGRES_DSN: cG9zdGdyZXNxbDovL3ppdGFkZWw6bGFiMDUtcG9zdGdyZXMtcGFzc3dvcmRAeml0YWRlbC1wb3N0Z3Jlcy56aXRhZGVsLnN2Yzo1NDMyL3ppdGFkZWw/c3NsbW9kZT1kaXNhYmxl
---
# Encrypts ZITADEL's sensitive data at rest; exactly 32 bytes. Losing it means losing that data,
# so in 05b it is the one value that moves to Vault unchanged.
apiVersion: v1
kind: Secret
metadata:
  name: zitadel-masterkey
  namespace: zitadel
type: Opaque
data:
  masterkey: bGFiMDUtbWFzdGVya2V5LW5vdC1hLXNlY3JldC0zMmM=
