# apps/external-secrets-store.yaml — the ClusterSecretStore, in its own Application:
# its CRD comes from apps/external-secrets.yaml and must exist before this syncs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-store
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    repoURL: https://github.com/miraccan00/platform-gitops.git
    targetRevision: blog-05b
    path: external-secrets/store
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 2m}
