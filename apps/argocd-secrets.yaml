# apps/argocd-secrets.yaml — ExternalSecrets for Argo CD's own Secrets.
# Not in apps/argocd.yaml: that Application is the Helm chart, and the CRD comes from external-secrets.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  source:
    repoURL: https://github.com/miraccan00/platform-gitops.git
    targetRevision: blog-05b
    path: argocd/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 2m}
